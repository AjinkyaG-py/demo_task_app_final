<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My App{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
    <div class="row align-items-center">
        <div class="col-md-8">
       <div class="card">
          <div class="card-body">
            <form class="form" method="POST">
              {{ login_form.csrf_token }}
              <label for="{{ login_form.email.id }}">{{ login_form.email.label }}</label><br>
              {{ login_form.email(id=login_form.email.id,class="form-control") }}<br>
              <label for="{{ login_form.password.id }}">{{ login_form.password.label }}</label><br>
              {{ login_form.password(id=login_form.password.id, class="form-control") }}<br>
              {{ login_form.submit(class="btn btn-primary btn-block btn-lg", style="background-color: #009530;") }}
            </form>
          </div>
        </div>
        </div>
    </div>
</div>
  
</body>
</html>
