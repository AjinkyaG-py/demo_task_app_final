<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="min-vh-100 d-flex flex-column m-0 bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-success bg-opacity-75 shadow-sm">
        <div class="container-fluid px-4">
            <a href="{{ url_for('writers.landing') }}" class="navbar-brand text-white fw-bold">Tracking App</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-white opacity-75 opacity-100-hover" href="{{ url_for('writers.landing') }}">Home</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="navbar-text text-white"><strong>{{ current_user.username }}</strong></span>
                    <a href="{{ url_for('login_page.logout') }}" class="btn btn-warning shadow-sm">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Workspace Container -->
    <main class="flex-grow-1 p-4 d-flex align-items-center justify-content-center">
        <div class="container" style="max-width: 600px;">
            <div class="card border-0 shadow-sm">
                <!-- Header Banner -->
                <div class="card-header bg-light py-3 border-bottom text-center">
                    <h3 class="mb-0 fw-bold text-dark">Timesheet Log</h3>
                </div>
                
                <!-- Content Body -->
                <div class="card-body p-4 text-center">
                    <p class="mb-0 fs-5 text-dark fw-medium">
                        Page to log Timespent on various tasks
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
